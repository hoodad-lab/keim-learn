<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEIM around the world</title>
<meta name="description" content="Fly around the globe to KEIM mineral paint projects: heritage, hospitals, schools, murals and landmarks.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
:root { --red: #D51F24; --ink: #1c2236; --mute: #6b6a66; --sans: "Josefin Sans", "Futura", "Avenir Next", system-ui, sans-serif; --serif: "Cormorant Garamond", Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04060c; color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#map { position: fixed; inset: 0; }
/* starfield behind the globe */
#map .maplibregl-canvas-container { background: radial-gradient(ellipse at 50% 45%, #18243f 0%, #070b16 55%, #020308 100%); }
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 3; padding: max(14px, env(safe-area-inset-top)) 16px 26px; pointer-events: none; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(4,6,12,.85), rgba(4,6,12,.55) 60%, rgba(4,6,12,0)); color: #fff; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 400 clamp(24px, 4vw, 36px)/1 "Abril Fatface", Georgia, serif; color: #fff; }
.brand .kick { font: 700 11px/1 var(--sans); letter-spacing: .24em; color: #ff6b6f; text-transform: uppercase; }
.brand .count { font: 500 14px/1.2 var(--sans); color: rgba(255,255,255,.75); }
.bar { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.bar::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid rgba(255,255,255,.7); background: rgba(10,14,26,.55); color: #fff; border-radius: 999px; padding: 8px 13px 7px; font: 700 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
.chip.au { border-color: var(--red); background: rgba(213,31,36,.35); }
.chip.au[aria-pressed="true"] { background: var(--red); color: #fff; border-color: var(--red); }
.search { flex: none; width: 200px; border: 1.5px solid rgba(255,255,255,.7); border-radius: 999px; padding: 8px 14px 7px; font: 600 13px/1 var(--sans); background: rgba(255,255,255,.95); color: var(--ink); }
.tools { position: fixed; right: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); display: grid; gap: 8px; z-index: 3; }
.tools button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); color: var(--ink); font: 700 10px/1.1 var(--sans); letter-spacing: .05em; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); cursor: pointer; }
/* pins */
.pin { width: 34px; height: 44px; cursor: pointer; filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)); transition: transform .15s; transform-origin: 50% 100%; }
.pin:hover, .pin.on { transform: scale(1.25); }
.pin svg { width: 100%; height: 100%; display: block; }
.clu { min-width: 38px; height: 38px; padding: 0 8px; border-radius: 19px; background: var(--ink); color: #fff; border: 3px solid #fff; display: grid; place-items: center; font: 700 14px/1 var(--sans); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.55); }
.clu.big { min-width: 48px; height: 48px; border-radius: 24px; font-size: 16px; }
.clu.au { background: var(--red); }
/* project card */
.card { position: fixed; z-index: 5; background: #fbf9f4; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.card[hidden] { display: flex; opacity: 0; pointer-events: none; }
@media (min-width: 761px) { .card { top: 16px; bottom: 16px; right: 16px; width: 400px; border-radius: 18px; } .card[hidden] { transform: translateX(30px); } body:not(.nocard) .tools { right: 432px; } }
@media (max-width: 760px) { .card { left: 0; right: 0; bottom: 0; max-height: 58vh; border-radius: 20px 20px 0 0; } .card[hidden] { transform: translateY(40px); } .card .ph { aspect-ratio: 16 / 8 !important; } .card h2 { font-size: 24px !important; } .card .body { padding: 14px 18px 18px !important; }
  .brand .kick { display: none; } .brand h1 { font-size: 24px; } .search { width: 150px; } body:not(.nocard) .tools { display: none; } }
.card .ph { position: relative; background: #ddd2bb; aspect-ratio: 3 / 2; flex: none; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; font: italic 500 17px var(--serif); color: #8a7f68; }
.card .credit { position: absolute; left: 10px; bottom: 8px; font: 500 11px/1.2 var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.card .tag { position: absolute; right: 10px; bottom: 8px; font: 700 10px/1 var(--sans); letter-spacing: .12em; color: #fff; background: rgba(28,34,54,.75); padding: 5px 8px 4px; border-radius: 999px; text-transform: uppercase; }
.card .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--ink); font-size: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.card .body { padding: 18px 20px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.card .kick { font: 700 11px/1.3 var(--sans); letter-spacing: .2em; color: var(--red); text-transform: uppercase; }
.card h2 { font: 600 28px/1.1 var(--serif); margin: 6px 0 4px; }
.card .sub { font: italic 500 17px/1.35 var(--serif); color: var(--mute); margin: 0 0 12px; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: 14px; line-height: 1.35; }
.card dt { font: 700 10.5px/1.6 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.card dd { margin: 0; }
.card dd.prod { font-weight: 700; color: var(--red); }
.card .story { font-size: 15px; line-height: 1.55; color: #33384a; margin: 10px 0 0; }
.card .approx { font: 600 12px/1.4 var(--sans); color: #8a6d1d; background: #fbf1d3; border-radius: 8px; padding: 7px 10px; margin-top: 12px; }
.card .more { display: inline-block; margin-top: 14px; font: 700 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--red); text-decoration: none; border-bottom: 2px solid var(--red); padding-bottom: 3px; }
.card .nav { display: flex; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e3dccd; }
.card .nav button { flex: 1; border: 1.5px solid var(--ink); background: #fff; border-radius: 12px; padding: 10px 8px 9px; font: 700 11px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.card .nav button.solid { background: var(--ink); color: #fff; }
.src { font: 500 11px/1.3 var(--sans); color: #9a937f; margin-top: 12px; }
.hint { position: fixed; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); z-index: 3; background: rgba(255,255,255,.95); color: var(--ink); font: 600 13px/1.3 var(--sans); padding: 10px 16px 9px; border-radius: 16px; max-width: calc(100% - 100px); pointer-events: none; transition: opacity .6s; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
.maplibregl-ctrl-attrib { font-size: 10px; }
.maplibregl-ctrl-top-right { top: 108px; }
@media (max-width: 760px) { .maplibregl-ctrl-top-right { top: 118px; } .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-in, .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-out { display: none; } }
</style>
</head>
<body class="nocard">
<div id="map"></div>
<header class="top">
  <div class="brand"><span class="kick">KEIM mineral paints</span><h1>KEIM around the world</h1><span class="count" id="count"></span></div>
  <div class="bar" id="bar">
    <input class="search" id="q" type="search" placeholder="Search a project or city" aria-label="Search projects">
    <button class="chip au" id="fAU" type="button" aria-pressed="false">Australia</button>
  </div>
</header>
<div class="tools"><button id="tTour" type="button" aria-label="Fly me around">TOUR</button><button id="tWorld" type="button" aria-label="Back to the globe">GLOBE</button></div>
<div class="hint" id="hint">Spin the globe, zoom in, and tap a pin to fly to the project</div>
<aside class="card" id="card" hidden aria-live="polite">
  <div class="ph" id="cPh"></div>
  <button class="x" id="cX" type="button" aria-label="Close">✕</button>
  <div class="body">
    <div class="kick" id="cKick"></div>
    <h2 id="cName"></h2>
    <p class="sub" id="cSub"></p>
    <dl id="cFacts"></dl>
    <p class="story" id="cStory"></p>
    <div class="approx" id="cApprox">Pin shows the suburb or city — the exact building isn’t marked yet.</div>
    <a class="more" id="cMore" target="_blank" rel="noopener">Read the full case study</a>
    <div class="src" id="cSrc"></div>
    <div class="nav"><button id="cBack" type="button">‹ Back</button><button id="cNext" class="solid" type="button">Next nearby ›</button></div>
  </div>
</aside>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPES = ['Heritage', 'Culture', 'Education', 'Health', 'Residential', 'Commercial', 'Transport', 'Hospitality', 'Civic', 'Mural'];
const LABEL = { Heritage: 'Heritage', Culture: 'Culture', Education: 'Education', Health: 'Health', Residential: 'Homes', Commercial: 'Commercial', Transport: 'Transport', Hospitality: 'Hotels', Civic: 'Civic', Mural: 'Murals', Community: 'Community' };
let P = [], vis = [], fType = null, fAU = false, fQ = '', sel = null, spinning = true, touring = false;
const hist = [];

// satellite imagery + place names, on a 3D globe
const map = new maplibregl.Map({
  container: 'map', center: innerWidth < 700 ? [100, 0] : [60, 15], zoom: innerWidth < 700 ? 0.9 : 1.9, maxPitch: 75, attributionControl: { compact: true },
  style: { version: 8, projection: { type: 'globe' },
    sources: {
      sat: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], attribution: 'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community' },
      names: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'] } },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }, { id: 'names', type: 'raster', source: 'names', paint: { 'raster-opacity': 0.85 } }],
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] } }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showCompass: true }), 'top-right');
map.on('load', () => { try { map.setSky({ 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] }); } catch (e) {} });

// slow spin of the globe until someone touches it
function spin() { if (!spinning || map.isMoving() || map.getZoom() > 3) return; const c = map.getCenter(); c.lng -= 2.2; map.easeTo({ center: c, duration: 1000, easing: n => n }); }
map.on('moveend', spin);
['mousedown', 'touchstart', 'wheel', 'dragstart'].forEach(ev => map.on(ev, () => { spinning = false; touring = false; hideHint(); }));
let hintGone = false; function hideHint() { if (!hintGone) { hintGone = true; $('hint').style.opacity = 0; } }
setTimeout(hideHint, 10000);

// pins and clusters as HTML markers, rebuilt as you move
const PIN = (au, on) => `<svg viewBox="0 0 34 44"><path d="M17 43C7 29 2 22 2 15a15 15 0 0 1 30 0c0 7-5 14-15 28z" fill="${on ? '#D51F24' : '#1c2236'}" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="15" r="6" fill="#fff"/>${au && !on ? '<circle cx="17" cy="15" r="3.2" fill="#D51F24"/>' : ''}</svg>`;
let markers = new Map();
function geo() { return { type: 'FeatureCollection', features: vis.map((p, i) => ({ type: 'Feature', properties: { i: P.indexOf(p), au: p.country === 'Australia' ? 1 : 0 }, geometry: { type: 'Point', coordinates: [p.lon, p.lat] } })) }; }
map.on('load', () => {
  map.addSource('pts', { type: 'geojson', data: geo(), cluster: true, clusterRadius: 46, clusterMaxZoom: 15, clusterProperties: { au: ['+', ['get', 'au']] } });
  map.addLayer({ id: 'pts-hit', type: 'circle', source: 'pts', paint: { 'circle-radius': 1, 'circle-opacity': 0 } });
  map.on('render', () => { if (map.isSourceLoaded('pts')) drawMarkers(); });
});
function drawMarkers() {
  const feats = map.querySourceFeatures('pts'), seen = new Set(), keep = new Map();
  for (const f of feats) {
    const pr = f.properties, key = pr.cluster ? 'c' + pr.cluster_id : 'p' + pr.i; if (seen.has(key)) continue; seen.add(key);
    let m = markers.get(key);
    if (!m) { const el = document.createElement('div');
      if (pr.cluster) { const n = pr.point_count; el.className = 'clu' + (n > 20 ? ' big' : '') + (pr.au === n ? ' au' : ''); el.textContent = n;
        el.onclick = e => { e.stopPropagation(); spinning = false; hideHint(); map.getSource('pts').getClusterExpansionZoom(pr.cluster_id).then(z => map.easeTo({ center: f.geometry.coordinates, zoom: Math.min(z + 0.5, 16), duration: 900 })); };
        m = new maplibregl.Marker({ element: el, opacityWhenCovered: '0' }).setLngLat(f.geometry.coordinates);
      } else { const p = P[pr.i]; el.className = 'pin'; el.title = p.name; el.innerHTML = PIN(pr.au, p === sel); el.onclick = e => { e.stopPropagation(); open(p, true); };
        m = new maplibregl.Marker({ element: el, anchor: 'bottom', opacityWhenCovered: '0' }).setLngLat([p.lon, p.lat]); m._p = p; }
      m.addTo(map); }
    keep.set(key, m); }
  for (const [k, m] of markers) if (!keep.has(k)) m.remove();
  markers = keep;
}
function repaintPins() { for (const [k, m] of markers) if (m._p) { m.getElement().innerHTML = PIN(m._p.country === 'Australia', m._p === sel); m.getElement().classList.toggle('on', m._p === sel); } }

// project card + fly-to
function open(p, fly) {
  spinning = false; hideHint(); if (sel && sel !== p && fly !== 'back') hist.push(sel); sel = p; repaintPins(); document.body.classList.remove('nocard');
  $('cPh').innerHTML = (p.img ? `<img src="img/${esc(p.img)}" alt="${esc(p.name)}">` : `<div class="noimg">Photo coming soon</div>`) + (p.credit ? `<span class="credit">Photo: ${esc(p.credit)}</span>` : '') + (p.render ? `<span class="tag">Artist’s impression</span>` : '');
  $('cKick').textContent = [LABEL[p.type] || p.type, [p.place, p.region, p.country].filter((v, i, a) => v && a.indexOf(v) === i).join(', ')].filter(Boolean).join(' · ');
  $('cName').textContent = p.name; $('cSub').textContent = p.sub || ''; $('cSub').hidden = !p.sub;
  const art = /^Artists?:/.test(p.architect || '');
  const rows = [['KEIM', p.products, 'prod'], ['Colours', p.colours], [art ? 'Artist' : 'Architect', art ? p.architect.replace(/^Artists?:\s*/, '') : p.architect], ['Builder', p.builder], ['Applicator', p.applicator], ['Area', p.area], ['Status', p.status]].filter(r => r[1]);
  $('cFacts').innerHTML = rows.map(([k, v, c]) => `<dt>${k}</dt><dd${c ? ' class="' + c + '"' : ''}>${esc(v)}</dd>`).join('');
  $('cStory').textContent = [p.story, p.notes].filter(Boolean).join(' '); $('cStory').hidden = !(p.story || p.notes);
  $('cApprox').hidden = !!p.exact;
  $('cMore').hidden = !p.link; if (p.link) $('cMore').href = p.link;
  $('cSrc').textContent = 'Source: ' + (p.src || 'KEIM');
  $('card').hidden = false; $('card').querySelector('.body').scrollTop = 0; $('cBack').disabled = !hist.length;
  if (fly) { const wide = innerWidth > 760;
    map.flyTo({ center: [p.lon, p.lat], zoom: p.exact ? 16.6 : 12.5, pitch: p.exact ? 58 : 35, bearing: (P.indexOf(p) * 37) % 60 - 30, speed: 0.9, curve: 1.6, essential: true,
      padding: wide ? { right: 420, top: 60, left: 0, bottom: 0 } : { bottom: innerHeight * 0.55, top: 80, left: 0, right: 0 } }); }
  try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
}
function close() { $('card').hidden = true; sel = null; repaintPins(); document.body.classList.add('nocard'); touring = false; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
$('cX').onclick = close; addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
function nextNearby() { if (!sel) return; const d = p => (p.lat - sel.lat) ** 2 + ((p.lon - sel.lon) * Math.cos(sel.lat * Math.PI / 180)) ** 2;
  const n = vis.filter(p => p !== sel && !hist.includes(p)).sort((a, b) => d(a) - d(b))[0]; if (n) open(n, true); }
$('cNext').onclick = () => { touring = false; nextNearby(); };
$('cBack').onclick = () => { if (hist.length) open(hist.pop(), 'back'); };
$('tWorld').onclick = () => { close(); hist.length = 0; map.flyTo({ center: [map.getCenter().lng, 15], zoom: innerWidth < 700 ? 0.9 : 1.9, pitch: 0, bearing: 0, speed: 1.2 }); spinning = true; };
// a little guided flight through highlights with photos
$('tTour').onclick = () => { const pool = vis.filter(p => p.img && p.exact); if (!pool.length) return; touring = true; let k = 0; const step = () => { if (!touring) return; open(pool[k++ % pool.length], true); setTimeout(() => map.once('moveend', () => setTimeout(step, 4500)), 400); }; step(); };

// filters + search
function syncChips() { document.querySelectorAll('#bar .chip[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === fType ? 'true' : 'false')); $('fAU').setAttribute('aria-pressed', fAU ? 'true' : 'false'); }
function refilter() { const q = fQ.toLowerCase();
  vis = P.filter(p => (!fType || p.type === fType) && (!fAU || p.country === 'Australia') && (!q || (p.name + ' ' + p.place + ' ' + p.country + ' ' + (p.region || '') + ' ' + p.products + ' ' + p.architect).toLowerCase().includes(q)));
  const nc = new Set(vis.map(p => p.country)).size; $('count').textContent = vis.length + ' projects · ' + nc + (nc === 1 ? ' country' : ' countries');
  const s = map.getSource && map.getSource('pts'); if (s) s.setData(geo()); }
$('fAU').onclick = () => { fAU = !fAU; syncChips(); refilter(); spinning = false; hideHint(); if (fAU) map.flyTo({ center: [134, -28], zoom: innerWidth < 700 ? 2.6 : 3.4, pitch: 0, bearing: 0, speed: 1.1 }); };
$('q').addEventListener('input', e => { fQ = e.target.value.trim(); refilter(); if (fQ && vis.length === 1) open(vis[0], true); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && vis.length) open(vis[0], true); });

fetch('projects.json').then(r => r.json()).then(list => {
  P = list.filter(p => p.lat != null);
  TYPES.filter(t => P.some(p => p.type === t)).forEach(t => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.dataset.t = t; b.textContent = LABEL[t]; b.setAttribute('aria-pressed', 'false'); b.onclick = () => { fType = fType === t ? null : t; syncChips(); refilter(); }; $('bar').appendChild(b); });
  refilter();
  const go = () => { const deep = decodeURIComponent(location.hash.slice(1)), p = deep && P.find(p => p.id === deep); if (p) open(p, true); else spin(); };
  if (map.loaded()) go(); else map.once('load', go);
});
</script>
</body>
</html>
