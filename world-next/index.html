<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEIM References Map</title>
<meta name="description" content="Fly around the globe to KEIM mineral paint projects: heritage, hospitals, schools, murals and landmarks.">

<script>(function () { var t; try { t = localStorage.getItem("keim-theme"); } catch (e) {} if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t; })();</script>
<style>
/* KEIM corporate design: KEIM Red, KEIM Anthracite, white; Futura (Jost as web stand-in); one secondary colour (Umbra) for headlines */
:root { --red: #D62025; --red2: #D10612; --anth: #36393C; --grey: #A3AAAE; --grey2: #D5D9DB; --umbra: #957F68; --ink: #1d1e20; --mute: #6c7174; --sans: "Jost", "Futura", "Futura PT", "Century Gothic", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #e4e7e9; color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#map { position: fixed; inset: 0; }
#map .maplibregl-canvas-container { background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, #eef0f1 45%, #c9ced1 100%); }
/* the 'panel': anthracite bar with the logo centred, wedge reaching below */
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 7; pointer-events: none; color: #fff; }
body:not(.nocard) .panel .logo { filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)) drop-shadow(0 3px 8px rgba(0,0,0,.45)); }
.top > * { pointer-events: auto; }
.panel { position: relative; height: calc(64px + env(safe-area-inset-top)); background: var(--anth); }
.panel .logo { position: absolute; left: 50%; bottom: -28px; transform: translateX(-50%); width: 68px; display: block; line-height: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.panel .logo img { width: 100%; height: auto; }
.panel .home { position: absolute; left: 16px; bottom: 20px; font: 500 12px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #fff; text-decoration: none; opacity: .85; }
.panel .home:hover { opacity: 1; }
.under { padding: 14px 16px 34px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(255,255,255,.96), rgba(255,255,255,.82) 60%, rgba(255,255,255,0)); color: var(--ink); }
body:not(.nocard) .under { padding-right: 446px; }
@media (max-width: 760px) { body:not(.nocard) .under { padding-right: 16px; } }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-right: 120px; }
.brand h1 { margin: 0; font: 500 clamp(20px, 2.6vw, 28px)/1.05 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--umbra); }
.brand h1 b { font-weight: 500; color: var(--anth); }
.brand .count { font: 300 15px/1.2 var(--sans); color: var(--mute); }
.bar { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.bar::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--anth); background: rgba(255,255,255,.9); color: var(--anth); border-radius: 2px; padding: 8px 12px 7px; font: 500 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip[aria-pressed="true"] { background: var(--anth); color: #fff; border-color: var(--anth); }
.chip.au { border-color: var(--red2); color: var(--red2); }
.chip.au[aria-pressed="true"] { background: var(--red2); color: #fff; border-color: var(--red2); }
.search { flex: none; width: 210px; border: 1px solid var(--anth); border-radius: 2px; padding: 8px 12px 7px; font: 400 14px/1 var(--sans); background: #fff; color: var(--ink); }
.tools { position: fixed; right: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); display: grid; gap: 6px; z-index: 3; }
.tools button { width: 58px; height: 40px; border-radius: 2px; border: 0; background: var(--anth); color: #fff; font: 500 11px/1 var(--sans); letter-spacing: .14em; box-shadow: 0 6px 18px -6px rgba(0,0,0,.5); cursor: pointer; }
@media (hover: hover) { .tools button:hover { background: var(--red2); } }
/* project card */
.card { position: fixed; z-index: 5; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.card[hidden] { display: flex; opacity: 0; pointer-events: none; }
@media (min-width: 761px) { .card { top: 116px; bottom: 16px; right: 16px; width: 410px; border-radius: 3px; } .card[hidden] { transform: translateX(30px); } body:not(.nocard) .tools { right: 442px; } }
@media (max-width: 760px) { .card { left: 0; right: 0; bottom: 0; max-height: 58vh; border-radius: 3px 3px 0 0; } .card[hidden] { transform: translateY(40px); } .card .ph { aspect-ratio: 16 / 8 !important; } .card h2 { font-size: 21px !important; } .card .body { padding: 14px 18px 18px !important; }
  .under { padding-top: 46px; } .brand { padding-right: 0; } .brand .count { display: none; } .brand h1 { font-size: 18px; } .search { width: 118px; } .bar .chip { padding: 8px 8px 7px; font-size: 11px; letter-spacing: .08em; } .panel .home { display: none; } body:not(.nocard) .tools { display: none; } }
.card .ph { position: relative; background: var(--grey2); aspect-ratio: 3 / 2; flex: none; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; font: 300 15px var(--sans); letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
.card .ph .noimg svg { width: 26px; height: 30px; }
.card .credit { position: absolute; left: 10px; right: 60px; bottom: 8px; font: 400 11px/1.25 var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.card .tag { position: absolute; right: 10px; bottom: 8px; font: 500 10px/1 var(--sans); letter-spacing: .14em; color: #fff; background: rgba(54,57,60,.85); padding: 5px 8px 4px; text-transform: uppercase; }
.card .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 2px; border: 0; background: var(--anth); color: #fff; font-size: 15px; cursor: pointer; }
.card .body { padding: 18px 22px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.card .kick { font: 500 11px/1.4 var(--sans); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
.card h2 { font: 500 25px/1.08 var(--sans); letter-spacing: .03em; text-transform: uppercase; color: var(--umbra); margin: 8px 0 0; }
.card h2::after { content: ""; display: block; height: 8px; background: var(--umbra); margin-top: 10px; }
.card .sub { font: 500 13px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--umbra); margin: 10px 0 4px; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 16px 0 12px; font: 400 15px/1.35 var(--sans); }
.card dt { font: 600 11px/1.7 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.card dd { margin: 0; }
.card dd.prod { font-weight: 500; color: var(--red); }
.card .story { font: 400 15px/1.6 var(--sans); color: #2b2d30; margin: 10px 0 0; }
.card .approx { font: 400 13px/1.4 var(--sans); color: var(--ink); background: #eef0f1; border-left: 3px solid var(--grey); padding: 8px 10px; margin-top: 12px; }
.card .more { display: inline-block; margin-top: 16px; font: 500 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #fff; background: var(--red2); text-decoration: none; padding: 11px 14px 10px; }
.card .more.sv { background: #fff; color: var(--anth); box-shadow: inset 0 0 0 1px var(--anth); }
.card .nav { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grey2); }
.card .nav button { flex: 1; border: 1px solid var(--anth); background: #fff; border-radius: 2px; padding: 11px 8px 10px; font: 500 11.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--anth); cursor: pointer; }
.card .nav button.solid { background: var(--anth); color: #fff; }
.card .nav button:disabled { opacity: .35; }
.src { font: 400 11.5px/1.35 var(--sans); color: var(--mute); margin-top: 12px; }
.src a { color: inherit; }
.hint { position: fixed; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); z-index: 3; background: #fff; color: var(--ink); font: 400 14px/1.3 var(--sans); padding: 11px 16px 10px; border-left: 4px solid var(--red); max-width: calc(100% - 100px); pointer-events: none; transition: opacity .6s; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
.legend { position: fixed; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); z-index: 2; display: flex; gap: 14px; background: #fff; box-shadow: 0 4px 14px -6px rgba(0,0,0,.4); padding: 8px 12px 7px; font: 500 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.legend i { display: inline-block; width: 11px; height: 13px; margin-right: 6px; vertical-align: -2px; clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
.maplibregl-ctrl-attrib { font-size: 10px; }
/* project list */
.list { position: fixed; z-index: 4; left: 16px; top: 172px; bottom: 76px; width: 330px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s; border-radius: 3px; }
.list[hidden] { display: flex; opacity: 0; pointer-events: none; transform: translateX(-24px); }
.list .lh { padding: 14px 16px 10px; border-bottom: 1px solid var(--grey2); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.list .lh b { font: 500 15px/1.1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--umbra); }
.list .lh span { font: 400 12px/1.2 var(--sans); color: var(--mute); }
.list .lh button { border: 0; background: none; font-size: 16px; cursor: pointer; color: var(--anth); }
.list .sort { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--grey2); }
.list .sort button { border: 1px solid var(--grey2); background: #fff; padding: 6px 9px 5px; font: 500 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--anth); cursor: pointer; }
.list .sort button[aria-pressed="true"] { background: var(--anth); color: #fff; border-color: var(--anth); }
.list ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.list li button { display: grid; grid-template-columns: 64px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eef0f1; background: #fff; padding: 9px 14px; cursor: pointer; font: inherit; color: var(--ink); }
.list li button:hover { background: #f5f6f7; }
.list li .th { width: 64px; height: 46px; background: var(--anth) center/cover no-repeat; position: relative; }
.list li .th.none::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 19px; transform: translate(-50%,-50%); background: var(--red); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.list li b { display: block; font: 500 13px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .03em; }
.list li small { display: block; font: 400 12px/1.3 var(--sans); color: var(--mute); margin-top: 3px; }
.list li small i { font-style: normal; color: var(--red); }
@media (max-width: 760px) { .list { left: 0; right: 0; width: auto; top: auto; bottom: 0; height: 60vh; border-radius: 3px 3px 0 0; } .list[hidden] { transform: translateY(30px); } }
.maplibregl-ctrl-top-right { top: 150px; }
@media (max-width: 760px) { .maplibregl-ctrl-top-right { top: 160px; } .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-in, .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-out { display: none; } .legend { display: none; } }

/* phone: bottom sheet */
.card .grab { display: none; }
.card .stick { position: sticky; top: 0; height: 0; z-index: 4; flex: none; }
@media (max-width: 760px) {
  .under { transition: transform .3s ease, opacity .25s; }
  body:not(.nocard) .under { transform: translateY(-40px); opacity: 0; pointer-events: none; }
  body:not(.nocard) .maplibregl-ctrl-top-right { display: none; }
  .card { height: 52dvh; max-height: none; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; transition: height .3s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; box-shadow: 0 -10px 40px rgba(0,0,0,.35); }
  .card.full { height: calc(100dvh - 64px - env(safe-area-inset-top)); }
  .card .body { overflow: visible; padding-bottom: calc(22px + env(safe-area-inset-bottom)) !important; }
  .card .ph { aspect-ratio: auto !important; height: 44vw; max-height: 210px; }
  .card .grab { display: block; position: absolute; left: 0; top: 0; height: 26px; border: 0; padding: 0; background: none; width: 100%; cursor: pointer; }
  .card .grab::before { content: ""; position: absolute; left: 50%; top: 7px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .card.full .grab::before { display: none; }
}

.card [hidden] { display: none !important; }
/* KEIM Australia showroom marker */
.hq { position: relative; width: 0; height: 0; cursor: pointer; z-index: 1; }
.hq[hidden] { display: none; }
.hq .ring, .hq .ring2 { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--red); transform: scaleY(.55); pointer-events: none; animation: hqp 2.4s ease-out infinite; }
.hq .ring2 { animation-delay: 1.2s; }
@keyframes hqp { 0% { opacity: .9; width: 18px; height: 18px; left: -9px; top: -9px; } 100% { opacity: 0; width: 120px; height: 120px; left: -60px; top: -60px; } }
.hq .dot { position: absolute; left: -6px; top: -4px; width: 12px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(1px); }
.hq .pin { position: absolute; left: -19px; bottom: -2px; width: 38px; height: 44px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); animation: hqdrop .6s cubic-bezier(.3,1.5,.5,1) both; transform-origin: 50% 100%; }
.hq .pin svg { width: 100%; height: 100%; display: block; }
@keyframes hqdrop { from { opacity: 0; transform: translateY(-30px) scale(.7); } to { opacity: 1; transform: none; } }
.hq .lab { position: absolute; left: 24px; bottom: 16px; background: #fff; padding: 6px 10px 5px; border-left: 3px solid var(--red); box-shadow: 0 4px 12px rgba(0,0,0,.35); white-space: nowrap; animation: hqin2 .45s .15s ease-out both; }
.hq .lab b { display: block; font: 500 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--anth); }
.hq .lab span { display: block; margin-top: 3px; font: 400 11px/1 var(--sans); color: var(--mute); }
@keyframes hqin2 { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
html[data-theme="dark"] .hq .lab { background: #141618; } html[data-theme="dark"] .hq .lab b { color: #fff; }
/* "find us" button — same family as the tool buttons */
.findus { position: fixed; z-index: 3; left: 16px; bottom: calc(max(30px, calc(env(safe-area-inset-bottom) + 14px)) + 42px); height: 34px; display: flex; align-items: center; gap: 8px; border: 0; background: var(--anth); color: #fff; padding: 0 12px 0 10px; border-radius: 2px; font: 500 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; box-shadow: 0 6px 18px -6px rgba(0,0,0,.5); transition: background .2s; }
.findus svg { width: 11px; height: 13px; flex: none; }
.findus:hover { background: var(--red2); }
.findus:hover svg path { fill: #fff; }
body.touring .findus, .embed .findus { display: none; }
@media (max-width: 760px) { .findus { bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); height: 40px; } body:not(.nocard) .findus { display: none; } }

/* tours */
.tmenu { position: fixed; z-index: 6; right: 84px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); width: 330px; max-height: min(560px, 70vh); background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.45); border-radius: 3px; display: flex; flex-direction: column; overflow: hidden; }
.tmenu[hidden] { display: none; }
.tmenu .th { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 12px; border-bottom: 3px solid var(--umbra); }
.tmenu .th b { font: 500 16px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--umbra); }
.tmenu .th button { border: 0; background: var(--anth); color: #fff; width: 30px; height: 30px; border-radius: 2px; cursor: pointer; }
.tmenu .tl { overflow-y: auto; padding: 6px 0 8px; }
.tmenu h4 { margin: 10px 16px 4px; font: 500 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.tmenu .opt { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; width: 100%; border: 0; background: #fff; padding: 8px 16px; text-align: left; cursor: pointer; font: inherit; color: var(--ink); }
.tmenu .opt:hover { background: var(--paper); }
.tmenu .opt.cur { box-shadow: inset 4px 0 0 var(--red); }
#tTour { position: relative; } #tTour.sel::after { content: ''; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px rgba(214,32,37,.3); }
.tmenu .opt .th2 { width: 54px; height: 40px; background: var(--grey2) center/cover; border-radius: 2px; }
.tmenu .opt b { display: block; font: 500 14px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--anth); }
.tmenu .opt small { display: block; font: 400 12.5px/1.3 var(--sans); color: var(--mute); margin-top: 2px; }
.tmenu .opt .n { font: 500 12px/1 var(--sans); color: #fff; background: var(--red2); padding: 5px 7px 4px; border-radius: 2px; }
.tbar { position: fixed; z-index: 6; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); display: flex; align-items: center; gap: 10px; background: var(--anth); color: #fff; padding: 8px 8px 8px 14px; border-radius: 2px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.6); border-left: 4px solid var(--red); max-width: calc(100vw - 32px); }
.tbar[hidden] { display: none; }
.tbar .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tbar .tt b { font: 500 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar .tt span { font: 400 12px/1 var(--sans); color: var(--grey); }
.tbar .prog { width: 90px; height: 3px; background: rgba(255,255,255,.2); }
.tbar .prog i { display: block; height: 100%; background: var(--red); width: 0; transition: width .4s; }
.tbar button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; height: 32px; min-width: 34px; padding: 0 10px; border-radius: 2px; font: 500 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.tbar button:hover { background: var(--red2); border-color: var(--red2); }
body.touring .legend, body.touring .hint { display: none; }
@media (min-width: 761px) { body:not(.nocard) .tbar { max-width: calc(100vw - 470px); } }
@media (max-width: 760px) {
  .tmenu { left: 0; right: 0; bottom: 0; width: auto; max-height: 75dvh; border-radius: 3px 3px 0 0; }
  .tbar { left: 0; right: 0; bottom: 0; top: auto; max-width: none; border-radius: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  body.touring .card { bottom: calc(52px + env(safe-area-inset-bottom)); }
  body.touring .card.full { height: calc(100dvh - 64px - 52px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .tbar .prog { display: none; } .tbar .tt { flex: 1; }
}

/* ---------- dark mode ---------- */
.theme { position: absolute; right: 14px; bottom: 14px; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.25); background: transparent; border-radius: 2px; color: #fff; cursor: pointer; display: grid; place-items: center; }
.theme:hover { background: rgba(255,255,255,.1); }
.theme svg { width: 17px; height: 17px; }
.theme .sun { display: none; } html[data-theme="dark"] .theme .sun { display: block; } html[data-theme="dark"] .theme .moon { display: none; }
html[data-theme="dark"] { --ink: #e9ebec; --mute: #9aa0a4; --umbra: #b9a48d; --line: #2c2f32; --surf: #141618; --surf2: #1e2124; color-scheme: dark; }
html[data-theme="dark"], html[data-theme="dark"] body { background: #000; }
html[data-theme="dark"] #map .maplibregl-canvas-container { background: radial-gradient(ellipse at 50% 50%, #1c1f22 0%, #0a0b0c 45%, #000 100%); }
html[data-theme="dark"] .panel { background: #111214; }
html[data-theme="dark"] .under { background: linear-gradient(rgba(8,9,10,.95), rgba(8,9,10,.78) 60%, rgba(8,9,10,0)); }
html[data-theme="dark"] .brand h1 b { color: #fff; }

  { id: 'northamerica', name: 'North America', desc: 'Capitols, lighthouses and landmarks in the USA and Canada', f: p => (p.country === 'United States' || p.country === 'Canada') && tourOK(p), max: 24, filt: { reg: 'am' } },
  { id: 'europe', name: 'Europe', desc: 'Where KEIM began — Germany and beyond', f: p => p.lon > -12 && p.lon < 40 && p.lat > 34 && tourOK(p), max: 24, filt: { reg: 'eu' } }
];
TYPES.forEach(t => TOURS.push({ id: t.toLowerCase(), name: LABEL[t], desc: '', f: p => p.type === t && (t === 'Residential' ? goodPic(p) : tourOK(p)), max: 24, filt: { type: t } }));
const TDESC = { heritage: 'Historic buildings restored with mineral paint', culture: 'Museums, galleries and theatres', education: 'Schools and universities', health: 'Hospitals and care', residential: 'Homes and apartments (with photos only)', commercial: 'Offices, retail and workplaces', transport: 'Stations, airports and infrastructure', hospitality: 'Hotels and venues', civic: 'Town halls, courts and public buildings', mural: 'Large-scale murals and street art' };
TOURS.forEach(t => { if (!t.desc) t.desc = TDESC[t.id] || ''; });
function route(list, start) { const out = [], left = list.slice(); let cur = start || left[0];
  while (left.length) { const c = Math.cos(cur.lat * Math.PI / 180); let bi = 0, bd = Infinity; left.forEach((p, i) => { const d = (p.lat - cur.lat) ** 2 + ((p.lon - cur.lon) * c) ** 2; if (d < bd) { bd = d; bi = i; } }); cur = left.splice(bi, 1)[0]; out.push(cur); }
  return out; }
function tourStops(t) { let L = P.filter(t.f); L.sort((a, b) => (goodPic(b) - goodPic(a)) || (yr(b) - yr(a))); L = L.slice(0, t.max);
  const start = t.hq ? HQ : t.id === 'europe' ? { lat: 48.4, lon: 10.8 } : L.slice().sort((a, b) => a.lon - b.lon)[0];
  const r = route(L, start); return t.hq ? [HQ, ...r] : r; }
let T = null, tk = 0, tTimer = 0;
function tourUI() { const on = !!T; $('tBar').hidden = !on; document.body.classList.toggle('touring', on); if (!on) return;
  $('tbName').textContent = T.name + ' tour'; $('tbStep').textContent = 'Stop ' + Math.min(tk, T.stops.length) + ' of ' + T.stops.length;
  $('tbProg').style.width = (100 * tk / T.stops.length) + '%'; $('tbPlay').textContent = touring ? 'Pause' : 'Play'; }
let tGen = 0;
function tourGo(i) { if (!T) return; clearTimeout(tTimer); const gen = ++tGen; tk = (i + T.stops.length) % T.stops.length; open(T.stops[tk], true); tk++; tourUI();
  if (touring) tTimer = setTimeout(() => map.once('moveend', () => { if (gen !== tGen) return; tTimer = setTimeout(() => { if (gen === tGen && touring && T) { if (tk >= T.stops.length) { touring = false; tourUI(); $('tbStep').textContent = 'Tour complete · ' + T.stops.length + ' stops'; } else tourGo(tk); } }, 5200); }), 400); }
function selTour() { if (!fType && !fReg && !fQ) return null; const parts = [fType ? LABEL[fType] : '', fReg ? { au: 'Australia', eu: 'Europe', am: 'Americas' }[fReg] : '', fQ ? '“' + fQ + '”' : ''].filter(Boolean);
  return { id: 'current', name: parts.join(' · '), desc: 'Tour the projects the map is showing now', f: p => vis.includes(p) && (p.type === 'Residential' ? goodPic(p) : tourOK(p)), max: 30, filt: { cur: true } }; }
function startTour(id) { const t = id === 'current' ? selTour() : TOURS.find(x => x.id === id); if (!t || !P.length) return; const stops = tourStops(t); if (!stops.length) return;
  $('tMenu').hidden = true; $('list').hidden = true; hideHint(); spinning = false;
  if (!t.filt.cur) { fType = t.filt.type || null; fReg = t.filt.keep ? fReg : (t.filt.reg || null); syncChips(); refilter(); }
  T = { ...t, stops }; touring = true; hist.length = 0; tourGo(0); if (id !== 'current') try { history.replaceState(null, '', '#tour=' + id); } catch (e) {} }
function endTour() { clearTimeout(tTimer); touring = false; T = null; tourUI(); }
function buildTourMenu() { const row = (t, min = 3) => { const st = tourStops(t); if (st.length < min) return ''; const pic = st.find(goodPic) || st[0]; const bg = goodPic(pic) ? (/^https?:/.test(pic.img) ? pic.img : 'img/' + pic.img) : pic === HQ ? '' : AER(pic, 128, 92);
    return `<button class="opt" type="button" data-tour="${t.id}"><span class="th2" style="background-image:url('${esc(bg)}')"></span><span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></span><span class="n">${st.length}</span></button>`; };
  const cur = selTour(), cr = cur ? row(cur, 1) : '';
  $('tmList').innerHTML = (cr ? '<h4>Your selection</h4>' + cr.replace('class="opt"', 'class="opt cur"') : '') + '<h4>Places</h4>' + TOURS.slice(0, 5).map(row).join('') + '<h4>By sector</h4>' + TOURS.slice(5).map(row).join(''); }
$('tTour').onclick = () => { if ($('tMenu').hidden) buildTourMenu(); $('tMenu').hidden = !$('tMenu').hidden; hideHint(); };
$('findUs').onclick = () => { if (T) endTour(); $('tMenu').hidden = true; hideHint(); open(HQ, true); };
$('tmX').onclick = () => { $('tMenu').hidden = true; };
$('tmList').addEventListener('click', e => { const b = e.target.closest('[data-tour]'); if (b) startTour(b.dataset.tour); });
$('tbPlay').onclick = () => { if (!T) return; touring = !touring; if (touring) { if (tk >= T.stops.length) tk = 0; tourGo(tk); } else { clearTimeout(tTimer); tGen++; tourUI(); } };
$('tbNext').onclick = () => { if (T) tourGo(tk); };
$('tbPrev').onclick = () => { if (T) tourGo(tk - 2); };
$('tbX').onclick = endTour;
setInterval(() => { if (T && !touring && $('tbPlay').textContent !== 'Play') tourUI(); }, 500);

// filters + search
function syncChips() { document.querySelectorAll('#bar .chip[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === fType ? 'true' : 'false')); document.querySelectorAll('#bar .chip[data-r]').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === fReg ? 'true' : 'false')); }
function refilter() { const q = fQ.toLowerCase();
  vis = P.filter(p => (!fType || p.type === fType) && (!fReg || REG[fReg].t(p)) && (!q || (p.name + ' ' + p.place + ' ' + p.country + ' ' + (p.region || '') + ' ' + p.products + ' ' + p.architect + ' ' + (p.artist || '') + ' ' + (p.builder || '') + ' ' + (p.applicator || '') + ' ' + (p.year || '')).toLowerCase().includes(q)));
  const nc = new Set(vis.map(p => p.country)).size; $('count').textContent = vis.length + ' projects · ' + nc + (nc === 1 ? ' country' : ' countries');
  for (const n of ['pts', 'pts2']) { const s = map.getSource && map.getSource(n); if (s) s.setData(geo()); } renderList(); $('tTour').classList.toggle('sel', !!(fType || fReg || fQ)); }
document.querySelectorAll('#bar .chip[data-r]').forEach(b => b.onclick = () => { const k = b.dataset.r; if (T) endTour(); fReg = fReg === k ? null : k; syncChips(); refilter(); spinning = false; hideHint(); if (fReg) { const g = REG[fReg]; map.flyTo({ center: g.c, zoom: innerWidth < 700 ? g.z[0] : g.z[1], pitch: 0, bearing: 0, speed: 1.1 }); } });
// suggestions under the search box: show matches, open only when one is clicked
const sug = document.createElement('div'); sug.className = 'sug'; sug.setAttribute('role', 'listbox'); document.body.appendChild(sug);
let sugList = [], sugAct = -1;
const hl = (t, q) => { const i = t.toLowerCase().indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); };
function sugScore(p, q) { const n = p.name.toLowerCase(); if (n.startsWith(q)) return 0; if (n.split(/[\s\-\/(),]+/).some(w => w.startsWith(q))) return 1; if (n.includes(q)) return 2; if ((p.place + ' ' + p.country + ' ' + (p.region || '')).toLowerCase().includes(q)) return 3; return 4; }
function sugPlace() { const r = $('q').getBoundingClientRect(), w = Math.min(Math.max(r.width, 300), innerWidth - 16); sug.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px'; sug.style.top = (r.bottom + 4) + 'px'; sug.style.width = w + 'px'; }
function sugShow() { const q = fQ.toLowerCase(); if (!q) { sug.classList.remove('on'); sugList = []; return; }
  sugList = vis.map(p => [sugScore(p, q), p]).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).slice(0, 8).map(x => x[1]); sugAct = -1;
  sug.innerHTML = sugList.length ? sugList.map((p, i) => `<button type="button" role="option" data-i="${i}"><b>${hl(p.name, q)}</b><span>${esc([p.place, p.country].filter(Boolean).join(', '))}${p.type ? ' · ' + esc(p.type) : ''}</span></button>`).join('') + (vis.length > 8 ? `<div class="none">${vis.length - 8} more · keep typing to narrow</div>` : '') : '<div class="none">No project matches that</div>';
  sugPlace(); sug.classList.add('on'); }
function sugPick(p) { sug.classList.remove('on'); $('q').blur(); fQ = ''; $('q').value = p.name; refilter(); open(p, true); }
$('q').addEventListener('input', e => { fQ = e.target.value.trim(); refilter(); sugShow(); });
$('q').addEventListener('focus', () => { if (fQ) sugShow(); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!sugList.length) return; e.preventDefault(); sugAct = (sugAct + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length) % sugList.length; sug.querySelectorAll('button').forEach((b, i) => b.classList.toggle('act', i === sugAct)); }
  else if (e.key === 'Enter') { if (sugAct >= 0) sugPick(sugList[sugAct]); else if (sugList.length === 1) sugPick(sugList[0]); }
  else if (e.key === 'Escape') sug.classList.remove('on'); });
sug.addEventListener('mousedown', e => e.preventDefault());
sug.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) sugPick(sugList[+b.dataset.i]); });
document.addEventListener('pointerdown', e => { if (e.target !== $('q') && !sug.contains(e.target)) sug.classList.remove('on'); });
addEventListener('resize', () => { if (sug.classList.contains('on')) sugPlace(); });

// list of projects in view
let lSort = 'name';
const yr = p => { const m = /(\d{4})/.exec(p.year || ''); return m ? +m[1] : 0; };
function renderList() { if ($('list').hidden) return;
  let L = vis; try { const b = map.getBounds(); if (map.getZoom() > 2.5) L = vis.filter(p => b.contains([p.lon, p.lat])); } catch (e) {}
  L = L.slice().sort(lSort === 'year' ? (a, b) => yr(b) - yr(a) || a.name.localeCompare(b.name) : lSort === 'country' ? (a, b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name) : (a, b) => a.name.localeCompare(b.name));
  $('lCount').textContent = L.length + (L.length === 1 ? ' project' : ' projects') + (L.length !== vis.length ? ' of ' + vis.length : '');
  $('lOl').innerHTML = L.map(p => `<li><button type="button" data-i="${P.indexOf(p)}"><span class="th${p.img || canAer(p) ? '' : ' none'}" ${p.img ? `style="background-image:url('${/^https?:/.test(p.img) ? esc(p.img) : 'img/' + esc(p.img)}')"` : canAer(p) ? `style="background-image:url('${AER(p, 128, 92)}')"` : ''}></span><span><b>${esc(p.name)}</b><small>${esc([p.place, p.country].filter(Boolean).join(', '))}${p.year ? ' · ' + esc(p.year) : ''}</small><small><i>${esc((p.products || '').replace(/\s*\(.*?\)/g, ''))}</i></small></span></button></li>`).join(''); }
$('lOl').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { open(P[+b.dataset.i], true); if (innerWidth <= 760) $('list').hidden = true; } });
$('tList').onclick = () => { $('list').hidden = !$('list').hidden; renderList(); hideHint(); };
$('lX').onclick = () => { $('list').hidden = true; };
$('lSort').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lSort = b.dataset.s; document.querySelectorAll('#lSort button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); });
map.on('moveend', renderList);
fetch('projects.json?v=1792233310').then(r => r.json()).then(list => {
  P = list.filter(p => p.lat != null);
  TYPES.filter(t => P.some(p => p.type === t)).forEach(t => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.dataset.t = t; b.textContent = LABEL[t]; b.setAttribute('aria-pressed', 'false'); b.onclick = () => { fType = fType === t ? null : t; syncChips(); refilter(); }; $('bar').appendChild(b); });
  refilter();
  const go = () => { const deep = decodeURIComponent(location.hash.slice(1)); if (/^tour=/.test(deep)) { startTour(deep.slice(5)); return; } const p = deep && (deep === HQ.id ? HQ : P.find(p => p.id === deep)); if (p) open(p, true); else spin(); };
  if (map.loaded()) go(); else map.once('load', go);
});


// three.js starfield behind the globe: turns with the Earth, twinkles, fades out as you zoom in
(function () {
  const cv = $('space'); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'; s.async = true;
  s.onload = () => { try {
    const T = window.THREE, R = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: false, powerPreference: 'low-power' });
    R.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); R.setClearColor(0x000000, 0);
    const scene = new T.Scene(), cam = new T.PerspectiveCamera(60, 1, 0.1, 100);
    const N = innerWidth < 760 ? 1800 : 3200, pos = new Float32Array(N * 3), sz = new Float32Array(N), ph = new Float32Array(N), col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
      pos[i * 3] = r * Math.cos(a) * 40; pos[i * 3 + 1] = u * 40; pos[i * 3 + 2] = r * Math.sin(a) * 40;
      const b = Math.pow(Math.random(), 6); sz[i] = 1.0 + b * 3.8; ph[i] = Math.random() * 6.283;
      const w = Math.random(); col[i * 3] = w < .15 ? 1 : .85 + w * .15; col[i * 3 + 1] = .9; col[i * 3 + 2] = w > .8 ? 1 : .85 + (1 - w) * .1; }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.setAttribute('size', new T.BufferAttribute(sz, 1)); g.setAttribute('phase', new T.BufferAttribute(ph, 1)); g.setAttribute('color', new T.BufferAttribute(col, 3));
    const mat = new T.ShaderMaterial({ transparent: true, depthWrite: false, blending: T.AdditiveBlending, uniforms: { t: { value: 0 }, k: { value: R.getPixelRatio() }, o: { value: 1 } },
      vertexShader: 'attribute float size; attribute float phase; attribute vec3 color; uniform float t; uniform float k; varying float vA; varying vec3 vC; void main(){ vC=color; vA = 0.55 + 0.45*sin(t*1.3 + phase); vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = size*k; gl_Position = projectionMatrix*mv; }',
      fragmentShader: 'uniform float o; varying float vA; varying vec3 vC; void main(){ vec2 d = gl_PointCoord-0.5; float r = length(d); float a = smoothstep(0.5,0.0,r); gl_FragColor = vec4(vC, a*a*vA*o); }' });
    const stars = new T.Points(g, mat); scene.add(stars);
    const size = () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }; size(); addEventListener('resize', size);
    let last = 0;
    const frame = t => { requestAnimationFrame(frame); if (document.hidden) return; last = t;
      const z = map.getZoom(), o = Math.max(0, Math.min(1, (5 - z) / 2)); cv.style.opacity = o; if (o <= 0) return;
      const c = map.getCenter(); stars.rotation.set(c.lat * Math.PI / 180 * 0.6, -c.lng * Math.PI / 180, 0); stars.rotation.z = map.getBearing() * Math.PI / 180;
      mat.uniforms.t.value = t / 1000; R.render(scene, cam); };
    requestAnimationFrame(frame);
  } catch (e) {} };
  document.head.appendChild(s);
})();


// soft blue atmosphere glow around the globe, kept the same size as the Earth on screen
(function () { const h = $('halo'); const upd = () => { const z = map.getZoom(), p = map.getPitch(), o = Math.max(0, Math.min(1, (3.6 - z) / 1.2)) * Math.max(0, 1 - p / 25);
  h.style.opacity = o; if (o <= 0) return; const r = 0.885 * 512 * Math.pow(2, z) / (2 * Math.PI), el = map.getContainer().getBoundingClientRect();
  h.style.width = h.style.height = (2 * r) + 'px'; h.style.left = (el.left + el.width / 2) + 'px'; h.style.top = (el.top + el.height / 2) + 'px'; };
  map.on('move', upd); map.on('load', upd); addEventListener('resize', upd); upd(); })();

// phone layout: search on its own row, KEIM button in the dock, swipe the project sheet down to close
(function () {
  if (innerWidth > 760) return;
  const q = $('q'), bar = $('bar'); bar.parentNode.insertBefore(q, bar);
  const hq = document.createElement('button'); hq.type = 'button'; hq.id = 'tHq'; hq.className = 'dockhq'; hq.textContent = 'KEIM'; hq.setAttribute('aria-label', 'KEIM Australia showroom');
  hq.onclick = () => $('findUs').click(); document.querySelector('.tools').prepend(hq);
  const fb = document.createElement('button'); fb.type = 'button'; fb.className = 'fbtn'; fb.setAttribute('aria-label', 'Filters');
  fb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><b></b>';
  q.parentNode.appendChild(fb); fb.onclick = () => q.parentNode.classList.toggle('open');
  const badge = () => { const n = (fType ? 1 : 0) + (fReg ? 1 : 0); fb.classList.toggle('on', n > 0); fb.querySelector('b').textContent = n; };
  bar.addEventListener('click', () => setTimeout(badge, 0)); badge();

  const card = $('card'); let sy = null, dy = 0, drag = false, fromTop = false;
  card.addEventListener('touchstart', e => { fromTop = !!e.target.closest('.ph, .stick'); if (!fromTop && card.scrollTop > 2) { sy = null; return; } sy = e.touches[0].clientY; dy = 0; drag = false; }, { passive: true });
  card.addEventListener('touchmove', e => { if (sy === null) return; dy = e.touches[0].clientY - sy;
    if (dy > 6 && card.scrollTop <= 0) { drag = true; card.style.transition = 'none'; card.style.transform = 'translateY(' + dy + 'px)'; if (e.cancelable) e.preventDefault(); } }, { passive: false });
  const end = () => { if (sy === null) return; card.style.transition = ''; card.style.transform = '';
    if (drag && dy > 90) { if (card.classList.contains('full')) card.classList.remove('full'); else close(); }
    else if (!drag && fromTop && dy < -30) card.classList.add('full');
    sy = null; drag = false; };
  card.addEventListener('touchend', end); card.addEventListener('touchcancel', end);
})();
</script>
