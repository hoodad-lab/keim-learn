<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEIM References Map</title>
<meta name="description" content="Fly around the globe to KEIM mineral paint projects: heritage, hospitals, schools, murals and landmarks.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
/* KEIM corporate design: KEIM Red, KEIM Anthracite, white; Futura (Jost as web stand-in); one secondary colour (Umbra) for headlines */
:root { --red: #D62025; --red2: #D10612; --anth: #36393C; --grey: #A3AAAE; --grey2: #D5D9DB; --umbra: #957F68; --ink: #1d1e20; --mute: #6c7174; --sans: "Jost", "Futura", "Futura PT", "Century Gothic", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #e4e7e9; color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#map { position: fixed; inset: 0; }
#map .maplibregl-canvas-container { background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, #eef0f1 45%, #c9ced1 100%); }
/* the 'panel': anthracite bar with the logo centred, wedge reaching below */
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none; color: #fff; }
.top > * { pointer-events: auto; }
.panel { position: relative; height: calc(64px + env(safe-area-inset-top)); background: var(--anth); }
.panel .logo { position: absolute; left: 50%; bottom: -38px; transform: translateX(-50%); width: 92px; display: block; line-height: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.panel .logo img { width: 100%; height: auto; }
.panel .home { position: absolute; left: 16px; bottom: 20px; font: 500 12px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #fff; text-decoration: none; opacity: .85; }
.panel .home:hover { opacity: 1; }
.under { padding: 14px 16px 34px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(255,255,255,.96), rgba(255,255,255,.82) 60%, rgba(255,255,255,0)); color: var(--ink); }
body:not(.nocard) .under { padding-right: 446px; }
@media (max-width: 760px) { body:not(.nocard) .under { padding-right: 16px; } }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-right: 120px; }
.brand h1 { margin: 0; font: 500 clamp(20px, 2.6vw, 28px)/1.05 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--umbra); }
.brand h1 b { font-weight: 500; color: var(--anth); }
.brand .count { font: 300 15px/1.2 var(--sans); color: var(--mute); }
.bar { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.bar::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--anth); background: rgba(255,255,255,.9); color: var(--anth); border-radius: 2px; padding: 8px 12px 7px; font: 500 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip[aria-pressed="true"] { background: var(--anth); color: #fff; border-color: var(--anth); }
.chip.au { border-color: var(--red2); color: var(--red2); }
.chip.au[aria-pressed="true"] { background: var(--red2); color: #fff; border-color: var(--red2); }
.search { flex: none; width: 210px; border: 1px solid var(--anth); border-radius: 2px; padding: 8px 12px 7px; font: 400 14px/1 var(--sans); background: #fff; color: var(--ink); }
.tools { position: fixed; right: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); display: grid; gap: 6px; z-index: 3; }
.tools button { width: 58px; height: 40px; border-radius: 2px; border: 0; background: var(--anth); color: #fff; font: 500 11px/1 var(--sans); letter-spacing: .14em; box-shadow: 0 6px 18px -6px rgba(0,0,0,.5); cursor: pointer; }
.tools button:hover { background: var(--red2); }
/* project card */
.card { position: fixed; z-index: 5; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.card[hidden] { display: flex; opacity: 0; pointer-events: none; }
@media (min-width: 761px) { .card { top: 116px; bottom: 16px; right: 16px; width: 410px; border-radius: 3px; } .card[hidden] { transform: translateX(30px); } body:not(.nocard) .tools { right: 442px; } }
@media (max-width: 760px) { .card { left: 0; right: 0; bottom: 0; max-height: 58vh; border-radius: 3px 3px 0 0; } .card[hidden] { transform: translateY(40px); } .card .ph { aspect-ratio: 16 / 8 !important; } .card h2 { font-size: 21px !important; } .card .body { padding: 14px 18px 18px !important; }
  .under { padding-top: 46px; } .brand { padding-right: 0; } .brand .count { display: none; } .brand h1 { font-size: 18px; } .search { width: 150px; } .panel .home { display: none; } body:not(.nocard) .tools { display: none; } }
.card .ph { position: relative; background: var(--grey2); aspect-ratio: 3 / 2; flex: none; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; font: 300 15px var(--sans); letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
.card .ph .noimg svg { width: 26px; height: 30px; }
.card .credit { position: absolute; left: 10px; right: 60px; bottom: 8px; font: 400 11px/1.25 var(--sans); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.card .tag { position: absolute; right: 10px; bottom: 8px; font: 500 10px/1 var(--sans); letter-spacing: .14em; color: #fff; background: rgba(54,57,60,.85); padding: 5px 8px 4px; text-transform: uppercase; }
.card .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 2px; border: 0; background: var(--anth); color: #fff; font-size: 15px; cursor: pointer; }
.card .body { padding: 18px 22px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.card .kick { font: 500 11px/1.4 var(--sans); letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
.card h2 { font: 500 25px/1.08 var(--sans); letter-spacing: .03em; text-transform: uppercase; color: var(--umbra); margin: 8px 0 0; }
.card h2::after { content: ""; display: block; height: 8px; background: var(--umbra); margin-top: 10px; }
.card .sub { font: 500 13px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--umbra); margin: 10px 0 4px; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 16px 0 12px; font: 400 15px/1.35 var(--sans); }
.card dt { font: 600 11px/1.7 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.card dd { margin: 0; }
.card dd.prod { font-weight: 500; color: var(--red); }
.card .story { font: 400 15px/1.6 var(--sans); color: #2b2d30; margin: 10px 0 0; }
.card .approx { font: 400 13px/1.4 var(--sans); color: var(--ink); background: #eef0f1; border-left: 3px solid var(--grey); padding: 8px 10px; margin-top: 12px; }
.card .more { display: inline-block; margin-top: 16px; font: 500 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #fff; background: var(--red2); text-decoration: none; padding: 11px 14px 10px; }
.card .more.sv { background: #fff; color: var(--anth); box-shadow: inset 0 0 0 1px var(--anth); }
.card .nav { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grey2); }
.card .nav button { flex: 1; border: 1px solid var(--anth); background: #fff; border-radius: 2px; padding: 11px 8px 10px; font: 500 11.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--anth); cursor: pointer; }
.card .nav button.solid { background: var(--anth); color: #fff; }
.card .nav button:disabled { opacity: .35; }
.src { font: 400 11.5px/1.35 var(--sans); color: var(--mute); margin-top: 12px; }
.src a { color: inherit; }
.hint { position: fixed; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); z-index: 3; background: #fff; color: var(--ink); font: 400 14px/1.3 var(--sans); padding: 11px 16px 10px; border-left: 4px solid var(--red); max-width: calc(100% - 100px); pointer-events: none; transition: opacity .6s; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
.legend { position: fixed; left: 16px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); z-index: 2; display: flex; gap: 14px; background: #fff; box-shadow: 0 4px 14px -6px rgba(0,0,0,.4); padding: 8px 12px 7px; font: 500 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.legend i { display: inline-block; width: 11px; height: 13px; margin-right: 6px; vertical-align: -2px; clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
.maplibregl-ctrl-attrib { font-size: 10px; }
/* project list */
.list { position: fixed; z-index: 4; left: 16px; top: 172px; bottom: 76px; width: 330px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s; border-radius: 3px; }
.list[hidden] { display: flex; opacity: 0; pointer-events: none; transform: translateX(-24px); }
.list .lh { padding: 14px 16px 10px; border-bottom: 1px solid var(--grey2); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.list .lh b { font: 500 15px/1.1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--umbra); }
.list .lh span { font: 400 12px/1.2 var(--sans); color: var(--mute); }
.list .lh button { border: 0; background: none; font-size: 16px; cursor: pointer; color: var(--anth); }
.list .sort { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--grey2); }
.list .sort button { border: 1px solid var(--grey2); background: #fff; padding: 6px 9px 5px; font: 500 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--anth); cursor: pointer; }
.list .sort button[aria-pressed="true"] { background: var(--anth); color: #fff; border-color: var(--anth); }
.list ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.list li button { display: grid; grid-template-columns: 64px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eef0f1; background: #fff; padding: 9px 14px; cursor: pointer; font: inherit; color: var(--ink); }
.list li button:hover { background: #f5f6f7; }
.list li .th { width: 64px; height: 46px; background: var(--anth) center/cover no-repeat; position: relative; }
.list li .th.none::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 19px; transform: translate(-50%,-50%); background: var(--red); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.list li b { display: block; font: 500 13px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .03em; }
.list li small { display: block; font: 400 12px/1.3 var(--sans); color: var(--mute); margin-top: 3px; }
.list li small i { font-style: normal; color: var(--red); }
@media (max-width: 760px) { .list { left: 0; right: 0; width: auto; top: auto; bottom: 0; height: 60vh; border-radius: 3px 3px 0 0; } .list[hidden] { transform: translateY(30px); } }
.maplibregl-ctrl-top-right { top: 150px; }
@media (max-width: 760px) { .maplibregl-ctrl-top-right { top: 160px; } .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-in, .maplibregl-ctrl-group button.maplibregl-ctrl-zoom-out { display: none; } .legend { display: none; } }

/* phone: bottom sheet */
.card .grab { display: none; }
.card .stick { position: sticky; top: 0; height: 0; z-index: 4; flex: none; }
@media (max-width: 760px) {
  .under { transition: transform .3s ease, opacity .25s; }
  body:not(.nocard) .under { transform: translateY(-40px); opacity: 0; pointer-events: none; }
  body:not(.nocard) .maplibregl-ctrl-top-right { display: none; }
  .card { height: 52dvh; max-height: none; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; transition: height .3s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; box-shadow: 0 -10px 40px rgba(0,0,0,.35); }
  .card.full { height: calc(100dvh - 64px - env(safe-area-inset-top)); }
  .card .body { overflow: visible; padding-bottom: calc(22px + env(safe-area-inset-bottom)) !important; }
  .card .ph { aspect-ratio: auto !important; height: 44vw; max-height: 210px; }
  .card .grab { display: block; position: absolute; left: 0; top: 0; height: 26px; border: 0; padding: 0; background: none; width: 100%; cursor: pointer; }
  .card .grab::before { content: ""; position: absolute; left: 50%; top: 7px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(0,0,0,.45); }
}
</style>
</head>
<body class="nocard">
<div id="map"></div>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add("embed");</script>
<style>.embed .top, .embed .hint, .embed .legend, .embed .list, .embed #tList { display: none !important; } .embed .maplibregl-ctrl-top-right { top: 16px !important; } .embed .card { top: 16px; }</style>
<header class="top">
  <div class="panel"><a class="home" href="../projects-next/" target="_top">‹ All projects</a><a class="logo" href="../projects-next/" target="_top" aria-label="KEIM projects"><img src="keim-logo-neg.png" alt="KEIM" width="92" height="94"></a></div>
  <div class="under"><div class="brand"><h1>KEIM references <b>worldwide</b></h1><span class="count" id="count"></span></div>
  <div class="bar" id="bar">
    <input class="search" id="q" type="search" placeholder="Search a project or city" aria-label="Search projects">
    <button class="chip au" id="fAU" type="button" aria-pressed="false">Australia</button>
  </div></div>
</header>
<div class="legend" id="legend"><span><i style="background:#D62025"></i>Australia</span><span><i style="background:#36393C;outline:1px solid #fff"></i>Worldwide</span></div>
<div class="tools"><button id="tMap" type="button" aria-label="Switch between street map and satellite">MAP</button><button id="tTour" type="button" aria-label="Fly me around">TOUR</button><button id="tWorld" type="button" aria-label="Back to the globe">GLOBE</button><button id="tList" type="button" aria-label="Show project list">LIST</button></div>
<aside class="list" id="list" hidden><div class="lh"><div><b>Projects in view</b><br><span id="lCount"></span></div><button id="lX" type="button" aria-label="Close list">✕</button></div><div class="sort" id="lSort"><button type="button" data-s="name" aria-pressed="true">A–Z</button><button type="button" data-s="year" aria-pressed="false">Newest</button><button type="button" data-s="country" aria-pressed="false">Country</button></div><ol id="lOl"></ol></aside>
<div class="hint" id="hint">Spin the globe, zoom in and tap a KEIM wedge to fly to the project</div>
<aside class="card" id="card" hidden aria-live="polite">
  <div class="stick"><button class="grab" id="cGrab" type="button" aria-label="Expand"></button><button class="x" id="cX" type="button" aria-label="Close">✕</button></div>
  <div class="ph" id="cPh"></div>
  <div class="body">
    <div class="kick" id="cKick"></div>
    <h2 id="cName"></h2>
    <p class="sub" id="cSub"></p>
    <dl id="cFacts"></dl>
    <p class="story" id="cStory"></p>
    <div class="approx" id="cApprox">Pin shows the suburb or city — the exact building isn’t marked yet.</div>
    <a class="more" id="cMore" target="_blank" rel="noopener">Read the full case study</a> <a class="more sv" id="cSv" target="_blank" rel="noopener">Google Street View ↗</a> <a class="more sv" id="cPp" target="_blank" rel="noopener"></a>
    <div class="src" id="cSrc"></div>
    <div class="nav"><button id="cBack" type="button">‹ Back</button><button id="cNext" class="solid" type="button">Next nearby ›</button></div>
  </div>
</aside>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPES = ['Heritage', 'Culture', 'Education', 'Health', 'Residential', 'Commercial', 'Transport', 'Hospitality', 'Civic', 'Mural'];
const LABEL = { Heritage: 'Heritage', Culture: 'Culture', Education: 'Education', Health: 'Health', Residential: 'Homes', Commercial: 'Commercial', Transport: 'Transport', Hospitality: 'Hotels', Civic: 'Civic', Mural: 'Murals', Community: 'Community' };
let P = [], vis = [], fType = null, fAU = false, fQ = '', sel = null, spinning = true, touring = false;
const hist = [];

// satellite imagery + place names, on a 3D globe
const map = new maplibregl.Map({
  container: 'map', center: innerWidth < 700 ? [100, 0] : [60, 15], zoom: innerWidth < 700 ? 0.9 : 1.9, maxPitch: 75, attributionControl: { compact: true },
  style: { version: 8, projection: { type: 'globe' },
    sources: {
      sat: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], attribution: 'Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community' },
      names: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'] } },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }, { id: 'names', type: 'raster', source: 'names', paint: { 'raster-opacity': 0.85 } }],
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] } }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showCompass: true }), 'top-right');
map.on('load', () => { try { map.setSky({ 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] }); } catch (e) {} });

// slow spin of the globe until someone touches it
function spin() { if (!spinning || map.isMoving() || map.getZoom() > 3) return; const c = map.getCenter(); c.lng -= 2.2; map.easeTo({ center: c, duration: 1000, easing: n => n }); }
map.on('moveend', spin);
['mousedown', 'touchstart', 'wheel', 'dragstart'].forEach(ev => map.on(ev, () => { spinning = false; touring = false; hideHint(); }));
let hintGone = false; function hideHint() { if (!hintGone) { hintGone = true; $('hint').style.opacity = 0; } }
setTimeout(hideHint, 10000);

// pins and clusters drawn inside the map itself (WebGL), so they stay glued to the ground while you move
// pins are the KEIM wedge (arch-shaped sector, point on the spot): KEIM Red for Australia, KEIM Anthracite worldwide
const WEDGE = 'M4.4 7.6A40 40 0 0 1 35.6 7.6L20 44Z';
const AER = (p, w, h) => { const d = 0.0011, e = d * w / h / Math.cos(p.lat * Math.PI / 180); return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=' + [p.lon - e, p.lat - d, p.lon + e, p.lat + d].map(v => v.toFixed(6)).join(',') + '&bboxSR=4326&imageSR=3857&size=' + w + ',' + h + '&format=jpg&f=image'; };
const SV = p => 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + p.lat + ',' + p.lon;
const canAer = p => !p.img && p.exact && p.type !== 'Residential';
const canSV = p => p.exact && p.type !== 'Residential';
const PIN = (au, on) => `<svg xmlns="http://www.w3.org/2000/svg" width="76" height="96" viewBox="0 0 40 50.5">${on ? `<path d="${WEDGE}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="7" stroke-linejoin="round"/>` : ''}<path d="${WEDGE}" fill="${au || on ? '#D62025' : '#36393C'}" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
function svgImg(svg) { return new Promise((res, rej) => { const im = new Image(76, 96); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }); }
// cluster bubbles are drawn on demand, one image per count
map.on('styleimagemissing', e => {
  const m = /^clu-(au|w)-(\d+)$/.exec(e.id); if (!m) return;
  const n = m[2], big = +n > 20, r = big ? 24 : 19, pad = 4, w = Math.max(2 * r, 22 + n.length * 18), W = (w + 2 * pad) * 2, H = (2 * r + 2 * pad) * 2;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.scale(2, 2);
  const cw = w, ch = 2 * r; x.beginPath(); x.roundRect(pad, pad, cw, ch, 4); x.fillStyle = m[1] === 'au' ? '#D62025' : '#36393C'; x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 6; x.shadowOffsetY = 2; x.fill();
  x.shadowColor = 'transparent'; x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
  x.fillStyle = '#fff'; x.font = `500 ${big ? 16 : 14}px Jost, Futura, system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(n, pad + cw / 2, pad + r + 1);
  map.addImage(e.id, { width: W, height: H, data: x.getImageData(0, 0, W, H).data }, { pixelRatio: 2 });
});
function geo() { return { type: 'FeatureCollection', features: vis.map(p => ({ type: 'Feature', properties: { i: P.indexOf(p), au: p.country === 'Australia' ? 1 : 0 }, geometry: { type: 'Point', coordinates: [p.lon, p.lat] } })) }; }
function selGeo() { return { type: 'FeatureCollection', features: sel ? [{ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [sel.lon, sel.lat] } }] : [] }; }
let layersReady = false;
map.on('load', async () => {
  const [pw, pa, po] = await Promise.all([svgImg(PIN(0, 0)), svgImg(PIN(1, 0)), svgImg(PIN(0, 1))]);
  map.addImage('pin-w', pw, { pixelRatio: 2 }); map.addImage('pin-au', pa, { pixelRatio: 2 }); map.addImage('pin-on', po, { pixelRatio: 2 });
  try { await document.fonts.load('500 14px Jost'); } catch (e) {}
  map.addSource('pts', { type: 'geojson', data: geo(), cluster: true, clusterRadius: 46, clusterMaxZoom: 15, clusterProperties: { au: ['+', ['get', 'au']] } });
  map.addSource('sel', { type: 'geojson', data: selGeo() });
  const common = { 'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-pitch-alignment': 'viewport', 'icon-rotation-alignment': 'viewport' };
  map.addLayer({ id: 'clu', type: 'symbol', source: 'pts', filter: ['has', 'point_count'],
    layout: { ...common, 'icon-image': ['concat', 'clu-', ['case', ['==', ['get', 'au'], ['get', 'point_count']], 'au', 'w'], '-', ['to-string', ['get', 'point_count']]] } });
  map.addLayer({ id: 'pins', type: 'symbol', source: 'pts', filter: ['!', ['has', 'point_count']],
    layout: { ...common, 'icon-image': ['case', ['==', ['get', 'au'], 1], 'pin-au', 'pin-w'], 'icon-anchor': 'bottom', 'symbol-sort-key': ['-', 0, ['get', 'i']] } });
  map.addLayer({ id: 'sel', type: 'symbol', source: 'sel', layout: { ...common, 'icon-image': 'pin-on', 'icon-anchor': 'bottom', 'icon-size': 1.25 } });
  layersReady = true;
  map.on('click', 'clu', e => { const f = e.features[0]; spinning = false; hideHint();
    map.getSource('pts').getClusterExpansionZoom(f.properties.cluster_id).then(z => map.easeTo({ center: f.geometry.coordinates, zoom: Math.min(z + 0.5, 16), duration: 900 })); });
  map.on('click', 'pins', e => { const p = P[e.features[0].properties.i]; if (p) open(p, true); });
  for (const id of ['clu', 'pins']) { map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer'); map.on('mouseleave', id, () => map.getCanvas().style.cursor = ''); }
});
function repaintPins() { const s = layersReady && map.getSource('sel'); if (s) s.setData(selGeo()); }

// satellite or street map
let street = false;
map.on('load', () => {
  map.addSource('street', { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'], attribution: 'Map © Esri, HERE, Garmin, OpenStreetMap contributors' });
  map.addLayer({ id: 'street', type: 'raster', source: 'street', layout: { visibility: 'none' } }, 'names');
});
$('tMap').onclick = () => { street = !street; map.setLayoutProperty('street', 'visibility', street ? 'visible' : 'none'); map.setLayoutProperty('names', 'visibility', street ? 'none' : 'visible'); $('tMap').textContent = street ? 'SAT' : 'MAP'; };

// project card + fly-to
function open(p, fly) {
  spinning = false; hideHint(); if (sel && sel !== p && fly !== 'back') hist.push(sel); sel = p; repaintPins(); document.body.classList.remove('nocard');
  $('cPh').innerHTML = canAer(p) ? `<img src="${AER(p, 640, 427)}" alt="Aerial view of ${esc(p.name)}"><span class="credit">Aerial view · Imagery © Esri, Maxar</span><span class="tag">Aerial</span>` : (p.img ? `<img src="${/^https?:/.test(p.img) ? esc(p.img) : 'img/' + esc(p.img)}" alt="${esc(p.name)}">` : `<div class="noimg"><svg viewBox="0 0 40 46"><path d="${WEDGE}" fill="#D62025"/></svg>Photo to come</div>`) + (p.ipage ? `<span class="credit">Photo: ${esc(p.iby || '')} · ${esc(p.ilic || '')} · Wikimedia Commons</span>` : p.credit ? `<span class="credit">Photo: ${esc(p.credit)}</span>` : '') + (p.render ? `<span class="tag">Artist’s impression</span>` : '');
  $('cKick').textContent = [LABEL[p.type] || p.type, [p.place, p.region, p.country].filter((v, i, a) => v && a.indexOf(v) === i).join(', ')].filter(Boolean).join(' · ');
  $('cName').textContent = p.name; $('cSub').textContent = p.sub || ''; $('cSub').hidden = !p.sub;
  const art = /^Artists?:/.test(p.architect || '');
  const rows = [['KEIM', p.products, 'prod'], ['Year', p.year ? p.year + (/^c\.|^by /.test(p.year) ? ' (approx.)' : '') : ''], ['Colours', p.colours], [art ? 'Artist' : 'Architect', art ? p.architect.replace(/^Artists?:\s*/, '') : p.architect], ['Builder', p.builder], ['Applicator', p.applicator], ['Area', p.area], ['Status', p.status]].filter(r => r[1]);
  $('cFacts').innerHTML = rows.map(([k, v, c]) => `<dt>${k}</dt><dd${c ? ' class="' + c + '"' : ''}>${esc(v)}</dd>`).join('');
  $('cStory').textContent = [p.story, p.notes].filter(Boolean).join(' '); $('cStory').hidden = !(p.story || p.notes);
  $('cApprox').hidden = !!p.exact;
  $('cMore').hidden = !p.link; if (p.link) $('cMore').href = p.link; $('cSv').hidden = !canSV(p); if (canSV(p)) $('cSv').href = SV(p); $('cPp').hidden = !p.ppage; if (p.ppage) { $('cPp').href = p.ppage; $('cPp').textContent = 'See photos · ' + (p.powner || 'source') + ' ↗'; }
  $('cSrc').innerHTML = 'Source: ' + esc(p.src || 'KEIM') + (p.year_src && p.year ? '<br>Year source: ' + (/^https?:/.test(p.year_src) ? '<a href="' + esc(p.year_src) + '" target="_blank" rel="noopener">' + esc(p.year_src.replace(/^https?:\/\/(www\.)?/, '').split('/')[0]) + '</a>' : esc(p.year_src)) : '') + (p.ipage ? `<br>Photo: <a href="${esc(p.ipage)}" target="_blank" rel="noopener">${esc(p.iby || 'Wikimedia Commons')}</a>, ${esc(p.ilic || '')}, via Wikimedia Commons (general view of the building)` : '');
  $('card').classList.remove('full'); $('card').hidden = false; $('card').scrollTop = 0; $('card').querySelector('.body').scrollTop = 0; $('cBack').disabled = !hist.length;
  if (fly) { const wide = innerWidth > 760;
    map.flyTo({ center: [p.lon, p.lat], zoom: p.exact ? 16.6 : 12.5, pitch: p.exact ? 58 : 35, bearing: (P.indexOf(p) * 37) % 60 - 30, speed: 0.9, curve: 1.6, essential: true,
      padding: wide ? { right: 430, top: 150, left: 0, bottom: 0 } : { bottom: innerHeight * 0.52, top: 70, left: 0, right: 0 } }); }
  try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
}
function close() { $('card').hidden = true; sel = null; repaintPins(); document.body.classList.add('nocard'); touring = false; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
$('cX').onclick = close; $('cGrab').onclick = () => $('card').classList.toggle('full'); $('card').addEventListener('scroll', () => { if (innerWidth <= 760 && $('card').scrollTop > 24) $('card').classList.add('full'); }, { passive: true }); addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
function nextNearby() { if (!sel) return; const d = p => (p.lat - sel.lat) ** 2 + ((p.lon - sel.lon) * Math.cos(sel.lat * Math.PI / 180)) ** 2;
  const n = vis.filter(p => p !== sel && !hist.includes(p)).sort((a, b) => d(a) - d(b))[0]; if (n) open(n, true); }
$('cNext').onclick = () => { touring = false; nextNearby(); };
$('cBack').onclick = () => { if (hist.length) open(hist.pop(), 'back'); };
$('tWorld').onclick = () => { close(); hist.length = 0; map.flyTo({ center: [map.getCenter().lng, 15], zoom: innerWidth < 700 ? 0.9 : 1.9, pitch: 0, bearing: 0, speed: 1.2 }); spinning = true; };
// a little guided flight through highlights with photos
$('tTour').onclick = () => { const pool = vis.filter(p => p.img && p.exact); if (!pool.length) return; touring = true; let k = 0; const step = () => { if (!touring) return; open(pool[k++ % pool.length], true); setTimeout(() => map.once('moveend', () => setTimeout(step, 4500)), 400); }; step(); };

// filters + search
function syncChips() { document.querySelectorAll('#bar .chip[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === fType ? 'true' : 'false')); $('fAU').setAttribute('aria-pressed', fAU ? 'true' : 'false'); }
function refilter() { const q = fQ.toLowerCase();
  vis = P.filter(p => (!fType || p.type === fType) && (!fAU || p.country === 'Australia') && (!q || (p.name + ' ' + p.place + ' ' + p.country + ' ' + (p.region || '') + ' ' + p.products + ' ' + p.architect + ' ' + (p.year || '')).toLowerCase().includes(q)));
  const nc = new Set(vis.map(p => p.country)).size; $('count').textContent = vis.length + ' projects · ' + nc + (nc === 1 ? ' country' : ' countries');
  const s = map.getSource && map.getSource('pts'); if (s) s.setData(geo()); renderList(); }
$('fAU').onclick = () => { fAU = !fAU; syncChips(); refilter(); spinning = false; hideHint(); if (fAU) map.flyTo({ center: [134, -28], zoom: innerWidth < 700 ? 2.6 : 3.4, pitch: 0, bearing: 0, speed: 1.1 }); };
$('q').addEventListener('input', e => { fQ = e.target.value.trim(); refilter(); if (fQ && vis.length === 1) open(vis[0], true); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && vis.length) open(vis[0], true); });

// list of projects in view
let lSort = 'name';
const yr = p => { const m = /(\d{4})/.exec(p.year || ''); return m ? +m[1] : 0; };
function renderList() { if ($('list').hidden) return;
  let L = vis; try { const b = map.getBounds(); if (map.getZoom() > 2.5) L = vis.filter(p => b.contains([p.lon, p.lat])); } catch (e) {}
  L = L.slice().sort(lSort === 'year' ? (a, b) => yr(b) - yr(a) || a.name.localeCompare(b.name) : lSort === 'country' ? (a, b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name) : (a, b) => a.name.localeCompare(b.name));
  $('lCount').textContent = L.length + (L.length === 1 ? ' project' : ' projects') + (L.length !== vis.length ? ' of ' + vis.length : '');
  $('lOl').innerHTML = L.map(p => `<li><button type="button" data-i="${P.indexOf(p)}"><span class="th${p.img || canAer(p) ? '' : ' none'}" ${p.img ? `style="background-image:url('${/^https?:/.test(p.img) ? esc(p.img) : 'img/' + esc(p.img)}')"` : canAer(p) ? `style="background-image:url('${AER(p, 128, 92)}')"` : ''}></span><span><b>${esc(p.name)}</b><small>${esc([p.place, p.country].filter(Boolean).join(', '))}${p.year ? ' · ' + esc(p.year) : ''}</small><small><i>${esc((p.products || '').replace(/\s*\(.*?\)/g, ''))}</i></small></span></button></li>`).join(''); }
$('lOl').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { open(P[+b.dataset.i], true); if (innerWidth <= 760) $('list').hidden = true; } });
$('tList').onclick = () => { $('list').hidden = !$('list').hidden; renderList(); hideHint(); };
$('lX').onclick = () => { $('list').hidden = true; };
$('lSort').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lSort = b.dataset.s; document.querySelectorAll('#lSort button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); });
map.on('moveend', renderList);
fetch('projects.json').then(r => r.json()).then(list => {
  P = list.filter(p => p.lat != null);
  TYPES.filter(t => P.some(p => p.type === t)).forEach(t => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.dataset.t = t; b.textContent = LABEL[t]; b.setAttribute('aria-pressed', 'false'); b.onclick = () => { fType = fType === t ? null : t; syncChips(); refilter(); }; $('bar').appendChild(b); });
  refilter();
  const go = () => { const deep = decodeURIComponent(location.hash.slice(1)), p = deep && P.find(p => p.id === deep); if (p) open(p, true); else spin(); };
  if (map.loaded()) go(); else map.once('load', go);
});
</script>
</body>
</html>
